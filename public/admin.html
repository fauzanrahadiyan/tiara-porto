async function openOrder(c){location.hash=c;const o=await A("order&c="+c);const S=o.status;
 const waC="https://wa.me/"+o.wa.replace(/\D/g,"").replace(/^0/,"62")+"?text="+encodeURIComponent(`Halo ${o.name}, dari Tiara Porto 👋 Status order ${o.code}: ${location.origin}/order.html?c=${o.code}`);
 const qc=o.qc;app(`<button class="btn2 sm" onclick="go('orders')">← Kembali</button>

// ===== KONTEN TIARA =====
async function konten(){const [g,qd,ttc,thc]=await Promise.all([A("golden").catch(e=>({slots:["12:15","19:30"],reason:e.message})),A("queue"),tiktokCard(),threadsCard()]);
 const icon={queued:"⏳",scheduled:"🗓️",processing:"⚙️",posted:"✅",failed:"❌"};
 app(`<h2>Konten Tiara</h2>

  <label>Ide / isi video (untuk caption AI)</label><input class="in" id="idea" placeholder="Contoh: Tiara jadi dokter, ngecek pasien lucu">

 ${ttc}
 ${thc}
 <div class="card"><h3>Kalender Konten</h3>${qd.queue.length?qd.queue.map(i=>`<div class="li" style="cursor:default"><div style="min-width:0"><b>${icon[i.status]||""} ${i.scheduledAt?tgl(i.scheduledAt):"Menunggu slot"}</b><div class="muted" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:230px">${esc((i.caption||"").split("\n")[0])}</div>${i.log?`<div class="muted ${i.status=="failed"?"err":""}">${esc(i.log)}</div>`:""}${i.permalink?`<a href="${esc(i.permalink)}" target="_blank" class="muted">Lihat di IG</a>`:""}${i.tt?`<div class="muted ${i.tt.status=="failed"?"err":""}">🎵 TikTok: ${esc(i.tt.log||i.tt.status)}</div>`:""}${i.tt&&i.tt.status=="failed"&&!i.videoDeleted?`<button class="btn2 sm" data-ttr="${i.id}">Kirim ulang ke TikTok</button>`:""}${i.th?`<div class="muted ${i.th.status=="failed"?"err":""}">🧵 Threads: ${esc(i.th.log||i.th.status)}</div>`:""}${i.th&&i.th.status=="failed"&&!i.videoDeleted?`<button class="btn2 sm" data-thr="${i.id}">Kirim ulang ke Threads</button>`:""}</div>

function tiktokBind(){if($("#ttc"))$("#ttc").onclick=async()=>{try{location.href=(await A("tiktok",{op:"connect"})).url}catch(e){toast(e.message,1)}};
 if($("#ttd"))$("#ttd").onclick=async()=>{if(!confirm("Putuskan TikTok?"))return;await A("tiktok",{op:"disconnect"});konten()};
 if($("#tts"))$("#tts").onclick=async()=>{try{await A("tiktok",{op:"settings",enabled:$("#tte").checked,privacy:$("#ttp").value});toast("Tersimpan ✓")}catch(e){toast(e.message,1)}};
 $$("[data-ttr]").forEach(b=>b.onclick=async()=>{b.disabled=true;b.textContent="Mengirim…";try{const r=await A("tiktok",{op:"retry",id:b.dataset.ttr});toast(r.result.done?.[0]?.log||"Diproses");konten()}catch(e){toast(e.message,1);b.disabled=false}})}

// ===== LAPORAN: UNTUNG-RUGI, TREN, MINGGUAN =====
const BLN=["Jan","Feb","Mar","Apr","Mei","Jun","Jul","Agu","Sep","Okt","Nov","Des"];const blnLabel=m=>BLN[+m.slice(5)-1]+" "+m.slice(0,4);
let PM="";
async function laporan(){const [p,r]=await Promise.all([A("profit"+(PM?"&m="+PM:"")),A("reports")]);PM=p.month;const c=p.settings,w=r.weekly;
 app(`<h2>Untung-Rugi</h2>
 <div class="card"><label>Bulan</label><select class="in" id="pm">${p.months.map(m=>`<option value="${m}" ${m==p.month?"selected":""}>${blnLabel(m)}</option>`).join("")}</select>
 <div class="row"><div><div class="muted">Pemasukan</div><div class="stat" style="font-size:17px">${rp(p.income)}</div></div><div><div class="muted">Modal</div><div class="stat" style="font-size:17px">${rp(p.modal)}</div></div><div><div class="muted">Untung bersih</div><div class="stat ${p.net>=0?"pink":"err"}" style="font-size:17px">${rp(p.net)}</div></div></div>
 <p class="muted" style="margin-top:8px">Modal = biaya produksi order ${rp(p.modalOrder)} + ${esc(c.fixedLabel)} ${rp(p.fixed)} + pengeluaran lain ${rp(p.modalManual)}</p></div>
 <div class="card"><h3>Order lunas (${p.rows.length})</h3>${p.rows.map(o=>`<div class="li" style="cursor:default"><div><b>${esc(o.name)}</b> <span class="muted">${o.code}</span><div class="muted">${o.pkg=="premium"?"Premium (Seedance)":"Hemat (Omni)"} · ${o.dur} dtk · ${tgl(o.t)}</div></div><div style="text-align:right"><b>${rp(o.income)}</b><div class="muted">modal ${rp(o.cost)}</div></div></div>`).join("")||`<p class="muted">Belum ada order lunas bulan ini.</p>`}</div>
 <div class="card"><h3>Pengeluaran lain</h3>${p.manual.map(e=>`<div class="li" style="cursor:default"><div>${esc(e.desc)}<div class="muted">${tgl(e.t)}</div></div><div style="text-align:right"><b>${rp(e.amount)}</b><br><button class="btn2 sm" data-dx="${e.id}">Hapus</button></div></div>`).join("")||`<p class="muted">Belum ada.</p>`}
 <div class="row"><input class="in" id="ed" placeholder="Contoh: Beli kredit ElevenLabs"><input class="in" id="ea" type="number" placeholder="Jumlah (Rp)"></div><button class="btn sm" id="ead">+ Tambah pengeluaran</button></div>
 <div class="card"><h3>Biaya modal otomatis</h3><label>Premium Seedance per 30 detik (720p)</label><input class="in" id="c1" type="number" value="${c.premiumPer30}"><label>Hemat Omni per 10 detik</label><input class="in" id="c2" type="number" value="${c.hematPer10}">
 <label>Biaya tetap bulanan</label><div class="row"><input class="in" id="c4" value="${esc(c.fixedLabel)}"><input class="in" id="c3" type="number" value="${c.fixedMonthly}"></div><button class="btn2 sm" id="csv">Simpan biaya</button><p class="muted">Modal order dihitung otomatis saat klik "Konfirmasi Lunas", sebanding durasi.</p></div>
 <h2 style="margin-top:18px">Tren & Laporan</h2>
 <div class="card"><div class="row"><h3>📈 Tren Harian</h3><button class="btn2 sm" id="tr" style="flex:0 0 auto;margin:0">↻ Buat sekarang</button></div>${r.trend?`<p class="muted">${esc(r.trend.date)}</p><p style="white-space:pre-wrap">${esc(r.trend.text)}</p>`:`<p class="muted">Belum ada. Otomatis dikirim ke Telegram tiap pagi setelah 06.00 WIB.</p>`}
 ${(r.trendHist||[]).length?`<details style="margin-top:8px"><summary class="muted">Tren hari sebelumnya</summary>${r.trendHist.map(t=>`<p class="muted" style="margin-top:8px"><b>${esc(t.date)}</b></p><p style="white-space:pre-wrap;font-size:13px">${esc(t.text)}</p>`).join("")}</details>`:""}</div>
 <div class="card"><div class="row"><h3>📊 Laporan Senin</h3><button class="btn2 sm" id="wk" style="flex:0 0 auto;margin:0">↻ Buat sekarang</button></div>${w?`<p class="muted">7 hari s/d ${esc(w.date)}</p>
 <div class="row"><div><div class="muted">Reels tayang</div><div class="stat" style="font-size:17px">${w.reels}</div></div><div><div class="muted">Ke TikTok</div><div class="stat" style="font-size:17px">${w.tiktok||0}</div></div><div><div class="muted">Komentar dibalas</div><div class="stat" style="font-size:17px">${w.replied}</div></div></div>
 <div class="row"><div><div class="muted">Pesanan masuk</div><div class="stat" style="font-size:17px">${w.ordersIn}</div></div><div><div class="muted">Pemasukan</div><div class="stat" style="font-size:17px">${rp(w.revenue)}</div></div><div><div class="muted">Untung</div><div class="stat pink" style="font-size:17px">${rp(w.profit)}</div></div></div>`:`<p class="muted">Belum ada. Otomatis dikirim ke Telegram tiap Senin setelah 07.00 WIB.</p>`}</div>`);
 $("#pm").onchange=e=>{PM=e.target.value;laporan()};
 $("#ead").onclick=async()=>{try{await A("profit",{op:"addExp",month:PM,desc:$("#ed").value,amount:$("#ea").value});toast("Tersimpan ✓");laporan()}catch(e){toast(e.message,1)}};
 $$("[data-dx]").forEach(b=>b.onclick=async()=>{if(!confirm("Hapus pengeluaran ini?"))return;await A("profit",{op:"delExp",id:b.dataset.dx,month:PM});laporan()});
 $("#csv").onclick=async()=>{await A("profit",{op:"costs",month:PM,premiumPer30:$("#c1").value,hematPer10:$("#c2").value,fixedMonthly:$("#c3").value,fixedLabel:$("#c4").value});toast("Tersimpan ✓");laporan()};
 const gen=(id,op,msg)=>$(id).onclick=async()=>{const b=$(id);b.disabled=true;b.textContent=msg;try{await A("reports",{op});toast("Terkirim ke Telegram ✓");laporan()}catch(e){toast(e.message,1);b.disabled=false;b.textContent="↻ Buat sekarang"}};
 gen("#tr","trend","Gemini mencari tren…");gen("#wk","weekly","Menghitung…")}

boot().catch(e=>app(`<div class="card err">${esc(e.message)}</div>`));
</script></body></html>
